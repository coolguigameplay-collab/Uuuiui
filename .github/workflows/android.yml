name: Android Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # HAXE
      # =========================================================
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      # =========================================================
      # ANDROID NDK
      # =========================================================
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      # =========================================================
      # ENVIRONMENT
      # =========================================================
      - name: Check Build Environment
        run: |
          echo "========================================"
          echo "HAXE"
          echo "========================================"
          haxe --version

          echo ""
          echo "========================================"
          echo "HAXELIB"
          echo "========================================"
          haxelib version

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"
          echo "$ANDROID_HOME"

          echo ""
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

      # =========================================================
      # CLEAN OLD BUILD OUTPUT
      # =========================================================
      - name: Clean Previous Android Build
        run: |
          rm -rf export/release/android
          rm -rf export/debug/android

          echo "Old Android build output removed."

      # =========================================================
      # INSTALL / UPDATE LIBRARIES
      # =========================================================
      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      # =========================================================
      # CHECK INSTALLED LIBRARIES
      # =========================================================
      - name: Verify Haxelib Libraries
        run: |
          echo "========================================"
          echo "HAXELIB LIST"
          echo "========================================"
          haxelib list

          echo ""
          echo "========================================"
          echo "LIME PATH"
          echo "========================================"
          haxelib path lime

          echo ""
          echo "========================================"
          echo "HXCPP PATH"
          echo "========================================"
          haxelib path hxcpp

          echo ""
          echo "========================================"
          echo "FLIXEL PATH"
          echo "========================================"
          haxelib path flixel

      # =========================================================
      # CONFIGURE LIME
      # =========================================================
      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
          haxelib run lime config ANDROID_SETUP true

      # =========================================================
      # VERIFY LIME CONFIGURATION
      # =========================================================
      - name: Verify Lime Configuration
        run: |
          echo "========================================"
          echo "LIME VERSION"
          echo "========================================"
          haxelib run lime --version

          echo ""
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"
          echo "$ANDROID_HOME"

          echo ""
          echo "========================================"
          echo "JAVA HOME"
          echo "========================================"
          echo "$JAVA_HOME_17_X64"

      # =========================================================
      # BUILD
      # =========================================================
      - name: Building the game
        run: |
          haxelib run lime build android -final -D ONLY_ARM64

      # =========================================================
      # INSPECT APK NATIVE LIBRARIES
      # =========================================================
      - name: Inspect APK Native Libraries
        shell: bash
        run: |
          APK=$(find export/release/android/bin/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "========================================"
          echo "APK LIBRARIES"
          echo "========================================"

          unzip -l "$APK" | grep "lib/arm64-v8a/.*\.so" || true

          echo ""
          echo "========================================"
          echo "CHECK libc++_shared.so"
          echo "========================================"

          if unzip -l "$APK" | grep -q "lib/arm64-v8a/libc++_shared.so"; then
            echo "libc++_shared.so FOUND"
          else
            echo "WARNING: libc++_shared.so NOT FOUND"
          fi

          echo ""
          echo "========================================"
          echo "CHECK liblime.so"
          echo "========================================"

          if unzip -l "$APK" | grep -q "lib/arm64-v8a/liblime.so"; then
            echo "liblime.so FOUND"
          else
            echo "ERROR: liblime.so NOT FOUND"
            exit 1
          fi

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Uploading APK
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
