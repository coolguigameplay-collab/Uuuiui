name: Android Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # HAXE 4.3.7
      # =========================================================
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7


      # =========================================================
      # ANDROID NDK r25c
      # =========================================================
      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c


      # =========================================================
      # ENVIRONMENT CHECK
      # =========================================================
      - name: Check Build Environment
        run: |
          set -e

          echo "========================================"
          echo "HAXE"
          echo "========================================"
          haxe --version

          echo ""
          echo "========================================"
          echo "HAXELIB"
          echo "========================================"
          haxelib version

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"
          echo "$ANDROID_HOME"

          echo ""
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version


      # =========================================================
      # IMPORTANT:
      # DO NOT RESTORE OLD NATIVE BUILD CACHE
      # =========================================================
      - name: Clean Native Build Cache
        run: |
          set -e

          rm -rf export/release/android
          rm -rf export/debug/android

          rm -rf ~/.lime
          rm -rf ~/.gradle/caches

          rm -rf export/android
          rm -rf export/release/android/haxe
          rm -rf export/release/android/obj

          echo "Native build cache cleaned."


      # =========================================================
      # INSTALL / UPDATE LIBRARIES
      # =========================================================
      - name: Installing/Updating libraries
        run: |
          set -e

          haxe -cp commandline -D analyzer-optimize --run Main setup -s


      # =========================================================
      # SHOW LIBRARIES
      # =========================================================
      - name: Verify Haxelib
        run: |
          set -e

          echo "========================================"
          echo "HAXELIB LIST"
          echo "========================================"

          haxelib list

          echo ""
          echo "========================================"
          echo "LIME PATH"
          echo "========================================"

          haxelib path lime

          echo ""
          echo "========================================"
          echo "HXCPP PATH"
          echo "========================================"

          haxelib path hxcpp

          echo ""
          echo "========================================"
          echo "FLIXEL PATH"
          echo "========================================"

          haxelib path flixel


      # =========================================================
      # CONFIGURE LIME
      # =========================================================
      - name: Configure Android
        run: |
          set -e

          haxelib run lime setup -alias -y

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
          haxelib run lime config ANDROID_SETUP true


      # =========================================================
      # VERIFY LIME
      # =========================================================
      - name: Verify Lime
        run: |
          set -e

          echo "========================================"
          echo "LIME VERSION"
          echo "========================================"

          haxelib run lime --version

          echo ""
          echo "========================================"
          echo "LIME PATH"
          echo "========================================"

          haxelib path lime

          echo ""
          echo "========================================"
          echo "NDK"
          echo "========================================"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version


      # =========================================================
      # BUILD
      # =========================================================
      - name: Building the game
        run: |
          set -e

          haxelib run lime build android -final -D ONLY_ARM64


      # =========================================================
      # FIND APK
      # =========================================================
      - name: Locate APK
        id: apk
        run: |
          set -e

          APK=$(find \
            export/release/android/bin/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "APK:"
          echo "$APK"


      # =========================================================
      # EXTRACT NATIVE LIBRARIES
      # =========================================================
      - name: Extract Native Libraries
        run: |
          set -e

          mkdir -p native-inspect

          unzip -o \
            "${{ steps.apk.outputs.APK }}" \
            "lib/arm64-v8a/*.so" \
            -d native-inspect

          echo ""
          echo "========================================"
          echo "ARM64 NATIVE LIBRARIES"
          echo "========================================"

          find native-inspect/lib/arm64-v8a \
            -type f \
            -name "*.so" \
            -print


      # =========================================================
      # CHECK liblime.so
      # =========================================================
      - name: Inspect liblime.so
        run: |
          set -e

          LIME="native-inspect/lib/arm64-v8a/liblime.so"

          if [ ! -f "$LIME" ]; then
            echo "ERROR: liblime.so is missing."
            exit 1
          fi

          echo "========================================"
          echo "liblime.so DEPENDENCIES"
          echo "========================================"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$LIME" \
            | grep NEEDED || true

          echo ""
          echo "========================================"
          echo "__emutls_get_address"
          echo "========================================"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -Ws "$LIME" \
            | grep "__emutls_get_address" || true


      # =========================================================
      # CHECK libc++_shared.so
      # =========================================================
      - name: Inspect libc++_shared.so
        run: |
          set -e

          LIBCXX="native-inspect/lib/arm64-v8a/libc++_shared.so"

          if [ ! -f "$LIBCXX" ]; then
            echo "WARNING: libc++_shared.so is not present."
            exit 0
          fi

          echo "========================================"
          echo "libc++_shared.so SYMBOL"
          echo "========================================"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -Ws "$LIBCXX" \
            | grep "__emutls_get_address" || true


      # =========================================================
      # CHECK ALL LIBRARIES FOR THE SYMBOL
      # =========================================================
      - name: Find emutls symbol providers
        run: |
          set -e

          READelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "========================================"
          echo "SEARCHING ALL ARM64 LIBRARIES"
          echo "========================================"

          FOUND=0

          for LIB in native-inspect/lib/arm64-v8a/*.so; do
            if "$READelf" -Ws "$LIB" 2>/dev/null \
              | grep -q "__emutls_get_address"; then

              echo ""
              echo "FOUND IN:"
              echo "$LIB"

              "$READelf" -Ws "$LIB" \
                | grep "__emutls_get_address"

              FOUND=1
            fi
          done

          echo ""

          if [ "$FOUND" -eq 0 ]; then
            echo "No __emutls_get_address symbol found."
          fi


      # =========================================================
      # APK CONTENT CHECK
      # =========================================================
      - name: Verify APK Contents
        run: |
          set -e

          echo "========================================"
          echo "ARM64 APK LIBRARIES"
          echo "========================================"

          unzip -l "${{ steps.apk.outputs.APK }}" \
            | grep "lib/arm64-v8a/.*\.so" \
            || true

          echo ""
          echo "========================================"
          echo "liblime.so"
          echo "========================================"

          if unzip -l "${{ steps.apk.outputs.APK }}" \
            | grep -q "lib/arm64-v8a/liblime.so"; then

            echo "OK: liblime.so exists."

          else

            echo "ERROR: liblime.so missing."
            exit 1

          fi


      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Uploading Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
